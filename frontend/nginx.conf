map $uri $frontend_cache_control {
  default "no-cache";
  /app-config.json "no-store";
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 16m;
  server_tokens off;

  # Script hashes are supplied by Angular's production autoCsp build.
  add_header Content-Security-Policy "style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; media-src 'none'; frame-src 'self'; worker-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Cache-Control $frontend_cache_control always;

  location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /app-config.json { try_files $uri =404; }

  location ~ /\. { deny all; }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
