services:
  backend:
    build:
      context: ./backend
      dockerfile: dockerfile
    image: forumish-backend
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      sqlserver:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      AutoMapper__LicenseKey: ${AUTOMAPPER_LICENSE_KEY:-}
      ConnectionStrings__Redis: "redis:6379,connectTimeout=3000,syncTimeout=1000,asyncTimeout=1000"
      ConnectionStrings__SqlServer: "Server=sqlserver,1433;Database=Forumish;User Id=sa;Password=${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env};Encrypt=True;TrustServerCertificate=True"
      Database__ApplyMigrations: "true"
    volumes:
      - backend-logs:/app/var/log
      - backend-attachments:/app/www/attachments

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - 'SQLCMDPASSWORD="$$MSSQL_SA_PASSWORD" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -Q "IF DB_ID(N''Forumish'') IS NOT NULL AND (ISNULL(CONVERT(nvarchar(60), DATABASEPROPERTYEX(N''Forumish'', N''Status'')), N'''') <> N''ONLINE'' OR ISNULL(HAS_DBACCESS(N''Forumish''), 0) <> 1) THROW 51000, ''Forumish is not ready'', 1; SELECT 1;" -b -o /dev/null'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  backend-logs:
  backend-attachments:
  sqlserver-data:
